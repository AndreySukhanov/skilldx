[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skilldx"
version = "0.4.0"
description = "Eval harness for agent skills (SKILL.md): does the skill trigger when it should, and does the agent follow it - across OpenAI, Qwen, DeepSeek, GLM, Kimi and any OpenAI-compatible model."
readme = "README.md"
license = "LicenseRef-Source-Available"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Andrey Sukhanov", email = "avsukhanov21@gmail.com" }]
keywords = ["llm", "evals", "agent-skills", "claude-code", "prompt-engineering"]
dependencies = [
  "openai>=1.40",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/AndreySukhanov/skilldx"
Source = "https://github.com/AndreySukhanov/skilldx"
Issues = "https://github.com/AndreySukhanov/skilldx/issues"

[project.scripts]
skilldx = "skilldx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["skilldx"]

# the source archive carries the code and the tests, not the examples and their response cache
[tool.hatch.build.targets.sdist]
include = ["skilldx", "tests", "examples/commit-message", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
