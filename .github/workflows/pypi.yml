name: pypi

# Publishes skillprobe to PyPI as `skilldx` on a GitHub release, through trusted publishing: no token in the repo.
# (`skillprobe` on PyPI is an unrelated project.) One-time setup on pypi.org by the owner: Publishing -> add a pending
# publisher with project skilldx, owner AndreySukhanov, repository skillprobe, workflow pypi.yml, environment pypi.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
