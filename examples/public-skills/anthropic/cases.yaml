# Golden set for routing over 14 skills from anthropics/skills.
# Labels follow ../LABELS.md: `loads` = the skill whose own description names this request;
# `not_loads` = skills whose description excludes it or that clearly belong elsewhere.
# Skills a case does not mention are plausible co-loads and are not scored.

- id: art-flow-field
  tags: [positive]
  prompt: Make a generative art piece in p5.js - particles following a Perlin-noise flow field, with a seed I can change.
  expect:
    loads: [algorithmic-art]
    not_loads: [canvas-design, frontend-design, web-artifacts-builder, slack-gif-creator, academy-guide, discernment-nudge]

